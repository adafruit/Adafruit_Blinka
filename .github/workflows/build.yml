name: Build CI

on: [pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - name: Translate Repo Name For Build Tools filename_prefix
      id: repo-name
      run: echo "repo-name=Adafruit-Blinka" >> $GITHUB_OUTPUT
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Versions
      run: |
        python3 --version
    - name: Checkout Current Repo
      uses: actions/checkout@v3
      with:
        submodules: true
    - name: Checkout tools repo
      uses: actions/checkout@v3
      with:
        repository: adafruit/actions-ci-circuitpython-libs
        path: actions-ci
    - name: Install dependencies
      # (e.g. - apt-get: gettext, etc; pip: circuitpython-build-tools, requirements.txt; etc.)
      run: |
        source actions-ci/install.sh
    - name: Pip install Sphinx, pre-commit
      run: |
        pip install --force-reinstall Sphinx sphinx-rtd-theme pre-commit
    - name: Library version
      run: git describe --dirty --always --tags
    - name: Pre-commit hooks
      run: |
        pre-commit run --all-files
    - name: Hardware-free tests
      run: |
        python -m pip install pytest 'pymcp2222>=1.0.1.7'
        PYTHONPATH=src python -m pytest -q \
          tests/test_mcp2221_gpio_cache.py \
          tests/test_mcp2222.py \
          tests/test_mcp2222_spi.py \
          tests/test_mcp2221_vref.py \
          tests/test_u2if_pwmout.py \
          tests/test_mip_package.py \
          tests/test_usb_hid.py \
          tests/test_pwm_chip_aliases.py \
          tests/test_agnostic_time.py \
          tests/test_busio_i2c.py \
          tests/test_busio_spi.py \
          tests/test_ftdi_i2c.py \
          tests/test_mcp2221_i2c.py \
          tests/test_mcp2221_hid.py \
          tests/test_mcp2221_led_modes.py \
          tests/test_circuitpython_api.py \
          tests/test_pin_repr.py \
          tests/test_rainbowio.py \
          tests/test_platform_dependencies.py \
          tests/test_uv_dependencies.py \
          tests/test_system_gpiod_compat.py \
          tests/test_libgpiod_pin.py \
          tests/test_libgpiod_legacy_cleanup.py \
          tests/test_khadas_vim3_gpiod.py \
          tests/test_raspberry_pi_*.py
    - name: Build docs
      working-directory: docs
      run: sphinx-build -E -W -b html . _build/html
    - name: Build Python package
      run: |
        pip install --upgrade build twine
        for file in $(find -not -path "./.*" -not -path "./docs*" \( -name "*.py" -o -name "*.toml" \) ); do
            sed -i -e "s/0.0.0+auto.0/1.2.3/" $file;
        done;
        python -m build
        twine check dist/*

  api-compatibility:
    name: CircuitPython API compatibility
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install API comparison tools
      id: tools
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r requirements-api.txt pytest
        if circuitpython_stable=$(gh api repos/adafruit/circuitpython/releases/latest --jq .tag_name); then
          if [[ "$circuitpython_stable" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if python -m pip download --only-binary=:all: --no-deps \
              --dest "${{ runner.temp }}/circuitpython-stubs" \
              "circuitpython-stubs==$circuitpython_stable"; then
              python -m pip install --no-deps --no-index \
                --find-links "${{ runner.temp }}/circuitpython-stubs" \
                "circuitpython-stubs==$circuitpython_stable"
            else
              echo "::notice::Matching stable stubs unavailable; comparing both revisions with the installed reference."
            fi
          else
            echo "::notice::Unexpected stable tag; comparing both revisions with the installed reference."
          fi
        else
          echo "::notice::Stable release lookup unavailable; comparing both revisions with the installed reference."
        fi
        reference=$(python -c 'from importlib.metadata import version; print(version("circuitpython-stubs"))') || exit 1
        echo "reference=$reference" >> "$GITHUB_OUTPUT"
        echo "CircuitPython stub reference used for both revisions: $reference"
    - name: Test checker with pinned tools
      run: python -m pytest -q tests/test_circuitpython_api.py
    - name: Check affected APIs for regressions
      env:
        API_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [[ -z "$API_BASE" || "$API_BASE" =~ ^0+$ ]]; then
          API_BASE=$(git rev-parse HEAD^) || exit 1
        fi
        python scripts/check_circuitpython_api.py \
          --base "$API_BASE" \
          --stable-release "${{ steps.tools.outputs.reference }}" \
          --json "${{ runner.temp }}/blinka-api.json" \
          --markdown "${{ runner.temp }}/blinka-api.md"
    - name: Upload API comparison reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: circuitpython-api-comparison
        path: |
          ${{ runner.temp }}/blinka-api.json
          ${{ runner.temp }}/blinka-api.md
        if-no-files-found: error
